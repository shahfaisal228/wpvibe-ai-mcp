name: HomeGlo MCP CI

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/homeglo-mcp-ci.yml"
  push:
    branches:
      - homeglo-self-hosted-mcp
    paths:
      - "server/**"
      - ".github/workflows/homeglo-mcp-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck
